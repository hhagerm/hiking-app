[project]
name = "hiking-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hhagerm", email = "hagermaxmilian@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
hiking-app = "hiking_app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
]
