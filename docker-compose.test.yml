name: hiking-app-test
services:
  db-test:
    image: postgis/postgis:18-3.6
    restart: no
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrator:
    build:
      context: .
      dockerfile: docker/migrator/Dockerfile
    environment:
      DATABASE_URL: postgresql://${TEST_POSTGRES_USER}:${TEST_POSTGRES_PASSWORD}@db-test:5432/${TEST_POSTGRES_DB}?sslmode=disable
    volumes:
      - ./migrations:/migrations
    depends_on:
      db-test:
        condition: service_healthy

